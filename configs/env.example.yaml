# 설정 예시 — 모든 키가 여기 등장한다.
#
# 운영 실값은 AA/configs/env.yaml 에 두고 --config 로 가리킨다. 이 파일은
# 커밋되고 그 파일은 커밋되지 않는다.
#
# 실행 환경에서는 코드를 한 줄도 못 고친다. 그래서 바뀔 만한 값은 전부 여기 있어야
# 한다. **"코드 한 줄만 고치면 되는데" 하는 순간이 오면 그 값이 여기 없었다는
# 뜻이다.** 고치지 말고 docs/insights/ 에 적어서 가지고 나올 것.
#
# 생략한 키는 src/ragdiag/settings.py 의 기본값을 쓴다. 그 기본값은 여기 적힌
# 것과 같다 - 다르면 config.py 의 테스트가 깨진다.
#
# ===========================================================================
# 반드시 채울 것 — 나머지는 전부 기본값으로 돈다
# ===========================================================================
#
#   paths.venv       쓰는 venv 경로         ← 다음 사이클에 이 줄만 보면 된다
#   llm.url          LLM 서버 주소          ← 없으면 판정을 시작할 수 없다
#   llm.key          접속 키                 ← 서버가 검사하지 않으면 아무 값
#   llm.model        모델 이름               ← 비우면 서버의 첫 모델을 쓴다
#
# 아래 `← 채우세요` 가 붙은 네 줄이다. 경로(conv_data 등)는 실행할 때 --conv-data
# 로 줘도 되므로 여기 채우지 않아도 된다.
#
# paths.venv 를 적어두면 **그 파이썬으로 갈아타서 실행한다.** activate 를 잊고
# 시스템 파이썬으로 쳐도 알아서 넘어간다 - 공용 환경에서 그걸 놓치면 다른 패키지
# 버전으로 돌면서 결과만 조용히 달라진다.
# 경로가 틀리면 계산을 시작하기 전에 죽는다.
#
# labels.query / labels.emotion 은 라벨·점수 조건을 쓰는 필터를 걸 때만 필요하다
# (--turns 로 고른 턴을 받으면 필요 없다).

# ---------------------------------------------------------------------------
# 입출력 경로
# ---------------------------------------------------------------------------
paths:
  venv: null                          # 예: /opt/shared/venv       ← 채우세요
                                      # 여기 적은 파이썬으로 갈아타서 실행한다
  conv_data: data/conv_eval.json      # 분석할 로그. --conv-data 로 줘도 된다
  filter_data: null                   # 필터 JSON. null 이면 진단 가능한 후속 턴 전부
  turns: null                         # 운영 필터가 고른 턴 목록. 주면 filter_data 를
                                      # 쓰지 않는다 (둘 다 주면 거절한다).
                                      # 형식은 todo/filter.md 참고
  output_dir: output                  # 산출물 디렉터리. 없으면 만든다
                                      # 파일명은 <끝난 시각>_<로그>_<필터>
                                      #   20260831-150422_conv_eval_negative.json
                                      #   20260831-150422_conv_eval_negative_summary.txt
  out: null                           # 결과 파일 경로를 직접 지정.
                                      # 주면 output_dir 와 시각 스탬프를 무시한다
  cache: .cache                       # LLM 판정 캐시. null 이면 캐시 안 씀
  # 조직 분류 체계 JSON. 대시보드 사이드바가 부서·직급을
  # 대분류 → 중분류 → 소분류 로 좁혀 고르게 한다. 없으면 원본 값으로만 고른다.
  # 어느 로그 필드에 붙는지는 값을 대조해 자동 판별한다 (파일 이름으로 추측하지 않는다).
  dept_class: null                    # 예: configs/dept_class.json
  job_class: null                     # 예: configs/job_class.json

# ---------------------------------------------------------------------------
# 라벨 표 (덮어쓰기 — 보통 비워 둔다)
#
# llm_eval_result / llm_emotion_result 의 라벨 이름과 점수는 사본의
# `configs/query_taxonomy.md` · `configs/emotion_taxonomy.md` 에 함께 온다.
# **비워 두면 그 표로 돈다 — 채울 필요가 없다.**
#
# 다른 점수표로 돌려보고 싶을 때만 여기에 문서를 가리킨다. 형식은 한 줄에
# `A. 이름 -> 점수`이고 `# 그룹명` 줄로 묶을 수 있다.
# 가리킨 파일이 없으면 계산을 시작하기 전에 죽는다.
# ---------------------------------------------------------------------------
labels:
  query: null               # 예: configs/query_taxonomy_2026.md
  emotion: null

# ---------------------------------------------------------------------------
# LLM 접속
#
# url·key 를 비워 두면 환경변수에서 찾는다 (LLM_API_URL / LLM_API_KEY).
# 실행 환경 .bashrc 에 이미 있으면 여기 적을 필요가 없다.
# ---------------------------------------------------------------------------
llm:
  backend: local            # local(OpenAI 호환 HTTP) | cli(claude -p) | api

  # 다른 프로젝트가 이미 vllm 주소·모델·키를 들고 있으면 그 파일을 가리킨다.
  # 아래 url/key/model 을 **비워 둘 때만** 거기서 끌어온다 - 여기 적은 값이
  # 언제나 이긴다. 두 벌로 두면 한쪽만 고치고 "왜 옛 서버로 가지" 를 찾게 된다.
  #
  #   env_file: ../serving/configs/env.yaml
  #   env_file_section: vllm
  #
  # 그 파일에서 <section>.base_url / model / api_key 를 읽는다.
  # 상대 경로는 실행 위치 기준이다.
  env_file: null
  env_file_section: vllm

  url: null                 # http://<서버>:8000                ← 채우세요
  key: null                 # 서버가 검사하지 않으면 아무 값     ← 채우세요
  model: null               # null 이면 서버의 첫 모델을 쓴다        ← 채우세요
  json_mode: auto           # auto | json_schema | guided_json | json_object | none
  thinking: auto            # auto | on | off
  max_tokens: 16000
  timeout_sec: 600

# ---------------------------------------------------------------------------
# 실행
# ---------------------------------------------------------------------------
run:
  workers: 4                # 동시 실행 턴 수
  limit: null               # 앞에서 N건만. 비용 확인용
  history_turns: 3          # Step 1 에 넘길 이전 질문 개수 상한. 0 이면 제한 없음
  legibility: true          # 관측 전에 답변만 보고 "읽을 수 있는 글인가" 를 LLM 에 묻는다
                            # (턴당 +1 호출). 토큰 잡탕 · 중간부터 깨진 답변을 case30 으로.
                            # 호출을 아끼려면 false - 코드 규칙(5555… !!!!…)은 그대로 돈다
  straggler_factor: 4.0     # 한 단계에서 절반이 끝난 뒤, 중앙값의 이 배수를 넘겨도 안 오는
  straggler_min_sec: 60     # 턴은 에러로 닫고 다음 단계로 간다 (최소 초와 큰 쪽). 0 이면 끔.
                            # 재실행하면 성공한 호출은 캐시에서 나오고 그 턴만 다시 묻는다

# ---------------------------------------------------------------------------
# 판정 임계값
#
# 여기 값을 바꾸면 골든셋·회귀셋을 다시 돌릴 것. 임계값 하나가 판정 전체를
# 움직인다. 특히 match_threshold 를 낮추면 지어낸 인용이 통과하기 시작한다.
# ---------------------------------------------------------------------------
thresholds:
  match_threshold: 0.9          # 문서 인용 대조 통과 최소 연속 일치 비율
  quote_match_threshold: 0.85   # 발화 인용(불만 근거 · 요구 · 어긴 조건) 대조 통과 비율
  evidence_min_quote_chars: 12   # 판정자가 낸 근거 인용의 최소 길이
  answer_quote_min_chars: 10    # 답변이 제시한 인용문의 최소 길이 (case24)

# ---------------------------------------------------------------------------
# 서비스 자원 부족 응답 (case9)
#
# 모델 자원을 확보하지 못했을 때 서비스가 답변 자리에 넣는 확정 문구.
# **배포마다 다르므로 운영 실값은 env.yaml 에 적는다.**
# 부분 일치라 뒤에 안내가 더 붙어도 잡힌다 - 앞부분만 정확하면 된다.
# ---------------------------------------------------------------------------
service_error:
  templates:
    - "서비스에 문제가 있거나, 사용자 분들이 많아서 서버에 부하가 걸리고 있어요"

# ---------------------------------------------------------------------------
# 조직 분류
# ---------------------------------------------------------------------------
org:
  # 조직 분류 체계가 붙을 수 있는 로그 필드. 값을 대조해 고른다.
  candidate_fields:
    - db_dept_name
    - db_job_name
    - job_grade
    - db_position_name

# ---------------------------------------------------------------------------
# 필터
# ---------------------------------------------------------------------------
filter:
  # 필터 값에서 "제한 없음"을 뜻하는 문자열들.
  any_values: ["전체", "all", "ALL", "", "*"]
